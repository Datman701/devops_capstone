# Nginx config for the ClinicDesk dashboard.
#
# Serves the built SPA and reverse-proxies /api to the backend so the browser
# makes same-origin requests. This mirrors the Ingress split used in M8, where
# /api goes to the backend service and everything else to the frontend.

upstream clinicdesk_backend {
    # `backend` is the Compose service name. Using the service name over a
    # resolvable hostname is what lets Docker's embedded DNS do the lookup.
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container-local health endpoint, used by the image HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://clinicdesk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Client-side routes such as /appointments must fall through to index.html,
    # otherwise a page refresh on a deep link returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html, or clients keep loading a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # The HTML shell sets its own Content-Security-Policy; don't let nginx add a
    # duplicate, conflicting header.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}