line-length = 90
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "E501",   # line length handled by the formatter
]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E402"]