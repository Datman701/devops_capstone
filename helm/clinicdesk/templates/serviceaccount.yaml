{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clinicdesk.serviceAccountName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never calls the Kubernetes API, so no RBAC permissions are granted.
automountServiceAccountToken: false
{{- end }}