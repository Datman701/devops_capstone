{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicdesk.postgresql.servicename" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: postgres
  selector:
    {{- include "clinicdesk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
{{- end }}